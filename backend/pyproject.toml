[project]
name = "portal-sa-backend"
version = "1.0.0"
description = "Backend API untuk Portal SA — manajemen proyek pre-sales dan aktivitas harian SA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "asyncpg==0.32.0",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "google-auth==2.62.1",
    "google-auth-oauthlib==1.5.0",
    "google-api-python-client==2.201.0",
    "httpx==0.28.1",
    "python-multipart==0.0.33",
    "python-dotenv==1.2.4",
]

# Dependency group untuk development (PEP 735). Ini sumber kebenaran dev deps
# saat memakai uv: `uv sync` memasang group ini secara default, `uv sync --no-dev`
# untuk build produksi. Tidak ikut ter-ship ke package.
[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

# Build backend uv-native (uv_build). Menggantikan setuptools: tanpa config
# package discovery, build cepat, dan terintegrasi penuh dengan uv/uv.lock.
[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout (bukan src/): module `app` ada langsung di root `backend/`.
# `alembic/` adalah tooling migration, bukan bagian package — tidak di-ship.
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort. Baseline konservatif —
# perluasan ruleset (UP/B/C4/SIM) ditangani di effort terpisah.
select = ["E", "F", "I"]
