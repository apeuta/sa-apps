version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: sa-portal-db
    restart: always
    environment:
      POSTGRES_USER: sa_portal
      POSTGRES_PASSWORD: "qpWOXX001**#"
      POSTGRES_DB: sa_portal_db
    ports:
      - "5433:5432"
    volumes:
      - /opt/docker_srv/sa-portal/postgres-data:/var/lib/postgresql/data
    networks:
      - sa-network

  backend:
    image: sa-portal-backend:latest
    container_name: sa-portal-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://sa_portal:qpWOXX001%2A%2A%23@db:5432/sa_portal_db"
    ports:
      - "8555:8000"
    volumes:
      - /opt/docker_srv/sa-portal/backend-data:/app/data
      - /opt/docker_srv/sa-portal/backend-logs:/app/logs
    networks:
      - sa-network

  frontend:
    image: sa-portal-frontend:latest
    container_name: sa-portal-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3535:3000"
    volumes:
      - /opt/docker_srv/sa-portal/frontend-public:/app/public
    networks:
      - sa-network

volumes: {}

networks:
  sa-network:
    driver: bridge
