version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: sa-portal-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - /opt/docker_srv/sa-portal/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa_portal -d sa_portal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sa-network

  backend:
    image: sa-portal-backend:latest
    container_name: sa-portal-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      DEMO_MODE: ${DEMO_MODE}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8555:8000"
    volumes:
      - /opt/docker_srv/sa-portal/backend-data:/app/data
      - /opt/docker_srv/sa-portal/backend-logs:/app/logs
    networks:
      - sa-network

  frontend:
    image: ghcr.io/apeuta/sa-portal-frontend:latest
    container_name: sa-portal-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "3535:3000"
    networks:
      - sa-network

networks:
  sa-network:
    driver: bridge
