# ============================================
# Override Docker Compose untuk development lokal
# ============================================
# OPT-IN: namanya sengaja bukan `compose.override.yaml` (yang di-auto-merge),
# jadi `docker compose up` polos di host produksi/VM tetap hanya memakai
# compose.yaml. Panggil eksplisit dari root repo:
#   docker compose -f compose.yaml -f compose.local.yaml up -d --build
#
# File ini hanya memuat PERBEDAAN dari compose.yaml: build dari source lokal
# (bukan prebuilt image), named volume lokal (bukan bind mount
# /opt/docker_srv/...), dan seed demo data. Sisanya (healthcheck, depends_on,
# environment, network, port) diwarisi dari compose.yaml.

# Build backend dipakai bersama oleh backend dan backend-init.
x-backend-build: &backend-build
  image: localhost/sa-portal/backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  db:
    # `!override` mengganti SELURUH daftar volumes dari compose.yaml (bukan
    # di-merge) supaya bind mount VM tidak ikut terbawa. PG18: mount ke
    # /var/lib/postgresql (bukan .../data), lihat catatan di compose.yaml.
    volumes: !override
      - postgres-data:/var/lib/postgresql

  # compose.yaml hanya menjalankan migration. Lokal ditambah seed demo; keduanya
  # idempotent sehingga aman dijalankan ulang tiap `up`.
  backend-init:
    <<: *backend-build
    command: >-
      sh -c "alembic upgrade head && python -m scripts.seed_demo_data"

  backend:
    <<: *backend-build
    # compose.yaml default ke ENVIRONMENT=production (aman untuk VM). Lokal
    # default ke development agar DEMO_MODE=true tidak memblok startup.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes: !override
      - backend-data:/app/data
      - backend-logs:/app/logs

  frontend:
    image: localhost/sa-portal/frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser memanggil path relatif `/api/v1`, yang di-handle proxy Next.js
        # (src/app/api/v1/[...path]/route.ts) dan diteruskan ke backend lewat
        # Docker network (BACKEND_URL). Jangan arahkan ke http://localhost:8555:
        # itu mem-bypass proxy (merusak CORS + penanganan auth/callback).
        NEXT_PUBLIC_API_URL: /api/v1

# `!override` agar driver_opts bind ke /opt/docker_srv (compose.yaml) tidak
# ikut ter-merge ke volume lokal.
volumes: !override
  postgres-data:
  backend-data:
  backend-logs:
