# Konfigurasi Alembic untuk Portal SA
# Digunakan untuk mengelola database migrations

[alembic]
# Path ke folder migrations
script_location = alembic

# Template file untuk migration baru
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone untuk nama file migration
# timezone =

# Panjang maksimal slug
truncate_slug_length = 40

# Set ke 'true' untuk menjalankan migrasi dari base tanpa existing database
prepend_sys_path = .

# SQLAlchemy URL - akan di-override oleh env.py dari settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@db:5432/portal_sa

[post_write_hooks]
# Jalankan formatter setelah generate migration
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# Konfigurasi logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
